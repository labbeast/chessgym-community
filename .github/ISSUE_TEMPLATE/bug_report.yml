name: Bug report
description: Report something that does not work as expected.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve ChessGym. For security issues, follow SECURITY.md instead of posting details here. Do not attach personal backups, tokens or commercial study material.
  - type: input
    id: version
    attributes:
      label: ChessGym version
      placeholder: "For example: 0.1.0-alpha.1"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and browser
      placeholder: "For example: Windows 11, Chrome"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Start from the screen or example needed to reproduce the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the exact error if one is shown.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots, logs or a small example
      description: Optional. Remove private information and share only material you have permission to distribute.
